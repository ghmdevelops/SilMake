<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#ec6f9b" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SilBeauty" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7fa" />

    <!-- SEO -->
    <meta name="description" content="SilBeauty — loja online de beleza e cuidado pessoal, com produtos feitos com carinho para você." />
    <meta name="keywords" content="SilBeauty, loja online, beleza, cuidado pessoal, cosméticos, e-commerce" />
    <meta name="author" content="SilBeauty" />
    <link rel="canonical" href="https://silbeauty.netlify.app/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SilBeauty" />
    <meta property="og:title" content="SilBeauty - Sua Loja Online" />
    <meta property="og:description" content="Beleza e cuidado em cada produto, com todo o carinho da SilBeauty." />
    <meta property="og:url" content="https://silbeauty.netlify.app/" />
    <meta property="og:locale" content="pt_BR" />
    <!-- Sem esta imagem, um link colado no WhatsApp aparece como um retângulo
         de texto cinza, que quase ninguém clica. Precisa ser URL absoluta:
         os robôs das redes sociais não resolvem caminho relativo. -->
    <meta property="og:image" content="https://silbeauty.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SilBeauty — maquiagem, skincare e perfumaria" />

    <!-- Twitter -->
    <!-- "summary_large_image" mostra a imagem grande; "summary" a deixa num
         quadradinho ao lado do texto. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SilBeauty - Sua Loja Online" />
    <meta name="twitter:description" content="Beleza e cuidado em cada produto, com todo o carinho da SilBeauty." />
    <meta name="twitter:image" content="https://silbeauty.netlify.app/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "SilBeauty",
        "description": "Loja online de beleza e cuidado pessoal, com produtos feitos com carinho.",
        "url": "https://silbeauty.netlify.app/"
      }
    </script>

    <title>SilBeauty - Sua Loja Online</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
